#-----------------------------------------------------------------------------#
# Run a series of progressively expensive checks on each pull request
#-----------------------------------------------------------------------------#

# TEST REPO ONLY: ultralite build only

name: pull_request
on:
  pull_request:
    branches: [develop, backports/**]
concurrency:
  group: pr-${{github.event.number}}
  cancel-in-progress: true
jobs:
  metadata:
    name: "Save job metadata"
    runs-on: ubuntu-24.04
    steps:
      # Event file is needed for pull_request_completed to provide the fork's context
      - name: Upload event file
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{github.event_path}}
          if-no-files-found: error
          retention-days: 1

  build-ultralite:
    uses: ./.github/workflows/build-ultralite.yml
